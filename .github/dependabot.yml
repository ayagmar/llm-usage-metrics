version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    versioning-strategy: increase
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies
      - security
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
    ignore:
      # This job also updates the site: the repo is one pnpm workspace with a single root
      # lockfile, so a separate /site job could never update the lockfile and its PRs failed.
      # The site stays on TypeScript 6 because astro check (Site - Astro Check in CI) refuses
      # TypeScript 7.0; lift this once the site's checker supports a stable TypeScript 7.
      # Root's `typescript` is also the TS6 API alias for typescript-eslint.
      # This rule does not cover the TypeScript 7 compiler (`@typescript/native`), but Dependabot
      # does not update `npm:` aliases at all, so bump that one by hand.
      - dependency-name: typescript
        versions: ['>=7']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore(ci)
    labels:
      - dependencies
      - security
    groups:
      # CodeQL fails when init and analyze run different versions, so bump them together.
      codeql-action:
        patterns:
          - 'github/codeql-action/*'
