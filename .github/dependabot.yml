version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    versioning-strategy: increase
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies
      - security
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
    ignore:
      # This job also updates the site in the pnpm workspace; see the /site job for why the
      # site stays on TypeScript 6. Root's `typescript` is the TS6 API alias for typescript-eslint;
      # the TypeScript 7 compiler is `@typescript/native` and keeps updating.
      - dependency-name: typescript
        versions: ['>=7']

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    versioning-strategy: increase
    commit-message:
      prefix: chore(site-deps)
    labels:
      - dependencies
      - security
    groups:
      site-dependencies:
        patterns:
          - '*'
    ignore:
      # astro check (Site - Astro Check in CI) refuses TypeScript 7.0 and asks for TypeScript 6;
      # its successor, @astrojs/ts-content-mapper, needs TypeScript 7.1+. The CLI itself already
      # type-checks with TypeScript 7 (@typescript/native). Lift this once the site's checker
      # supports a stable TypeScript 7.
      - dependency-name: typescript
        versions: ['>=7']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore(ci)
    labels:
      - dependencies
      - security
