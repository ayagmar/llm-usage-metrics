name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Main project validation
  main-lint:
    name: Main - Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.9.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint

  main-format:
    name: Main - Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.9.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check

  main-typecheck:
    name: Main - Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.9.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck

  main-mermaid:
    name: Main - Mermaid Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.9.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: node scripts/validate-mermaid.mjs

  main-build:
    name: Main - Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [main-lint, main-format, main-typecheck]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.9.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run pack:check

  main-test:
    name: Main - Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [main-build]
    permissions:
      contents: read
      issues: write # Coverage comments use the issue-comments API.
      id-token: write # Codecov uploads authenticate with OIDC.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.9.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run smoke:dist-opencode
      - run: pnpm run test
      - name: Enforce coverage threshold
        run: node .github/scripts/check-coverage-threshold.mjs
      - name: Upload coverage
        if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          version: v11.3.1
          files: coverage/lcov.info
          fail_ci_if_error: true
      - name: Build coverage summary
        run: node .github/scripts/build-coverage-summary.mjs
      - name: Add coverage summary
        run: cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment coverage on PR
        if: ${{ github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && !github.event.pull_request.head.repo.fork }}
        continue-on-error: true # Coverage reporting must not mask a passing test suite.
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- coverage-report -->';
            const body = `${marker}\n${fs.readFileSync('coverage/summary.md', 'utf8')}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((c) =>
              c.user?.type === 'Bot' && c.body?.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage

  # Supported runtimes and platforms beyond the coverage run above.
  main-test-matrix:
    name: Main - Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    needs: [main-build]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.16.0', '24.21.0']
        exclude:
          # main-test already covers this pair, with coverage.
          - os: ubuntu-latest
            node: '24.21.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.9.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run smoke:dist-opencode
      - run: pnpm exec vitest run --coverage.enabled=false

  main-bun:
    name: Main - Bun smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [main-build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.9.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # Report parity with Node (cold with parse workers, warm from the event store) and statusline.
      - run: pnpm run smoke:dist-bun
      # The OpenCode source reads SQLite through node:sqlite, which Bun provides.
      - run: bun scripts/smoke-dist-opencode.mjs

  # Site validation (parallel)
  site-format:
    name: Site - Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.9.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter llm-usage-metrics-site run format:check

  site-check:
    name: Site - Astro Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.9.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run site:check

  site-build:
    name: Site - Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [site-format, site-check, main-build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.9.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run site:docs:generate -- --rebuild
      - run: git diff --exit-code -- site/src/content/docs/cli-reference.mdx site/src/content/docs/security.mdx
      - run: pnpm run site:build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-dist
          path: site/dist

  # Final status check
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      [
        main-lint,
        main-format,
        main-typecheck,
        main-mermaid,
        main-test,
        main-test-matrix,
        main-bun,
        site-format,
        site-check,
        site-build,
      ]
    if: always()
    env:
      MAIN_LINT_RESULT: ${{ needs.main-lint.result }}
      MAIN_FORMAT_RESULT: ${{ needs.main-format.result }}
      MAIN_TYPECHECK_RESULT: ${{ needs.main-typecheck.result }}
      MAIN_MERMAID_RESULT: ${{ needs.main-mermaid.result }}
      MAIN_TEST_RESULT: ${{ needs.main-test.result }}
      MAIN_TEST_MATRIX_RESULT: ${{ needs.main-test-matrix.result }}
      MAIN_BUN_RESULT: ${{ needs.main-bun.result }}
      SITE_FORMAT_RESULT: ${{ needs.site-format.result }}
      SITE_CHECK_RESULT: ${{ needs.site-check.result }}
      SITE_BUILD_RESULT: ${{ needs.site-build.result }}
    steps:
      - name: Check all jobs passed
        run: |
          if [ "$MAIN_LINT_RESULT" != "success" ] || \
             [ "$MAIN_FORMAT_RESULT" != "success" ] || \
             [ "$MAIN_TYPECHECK_RESULT" != "success" ] || \
             [ "$MAIN_MERMAID_RESULT" != "success" ] || \
             [ "$MAIN_TEST_RESULT" != "success" ] || \
             [ "$MAIN_TEST_MATRIX_RESULT" != "success" ] || \
             [ "$MAIN_BUN_RESULT" != "success" ] || \
             [ "$SITE_FORMAT_RESULT" != "success" ] || \
             [ "$SITE_CHECK_RESULT" != "success" ] || \
             [ "$SITE_BUILD_RESULT" != "success" ]; then
            echo "❌ CI failed"
            exit 1
          fi
          echo "✅ CI passed"
