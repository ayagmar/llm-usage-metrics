name: Release core library

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Pack and check without publishing
        required: true
        default: true
        type: boolean

concurrency:
  group: release-core-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish @ayagmar/agent-sessions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # npm trusted publishing uses OIDC.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.9.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build, test and check the package
        run: |
          pnpm run core:typecheck
          pnpm run core:lint
          pnpm run core:test
          pnpm run core:build
          pnpm run core:pack:check

      - name: Dry run publish
        if: ${{ inputs.dry_run }}
        working-directory: packages/core
        run: npm publish --dry-run

      - name: Publish
        if: ${{ !inputs.dry_run }}
        working-directory: packages/core
        run: npm publish
