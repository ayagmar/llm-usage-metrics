name: Release

on:
  workflow_dispatch:
    inputs:
      increment:
        description: Version bump type
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      dry_run:
        description: Run release-it in dry-run mode
        required: true
        default: true
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # release-it pushes the release commit and tag.
      id-token: write # npm trusted publishing uses OIDC.

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          # release-it pushes the release commit and tag.
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.13.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.13.1'
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Smoke test built dist (OpenCode)
        run: pnpm run smoke:dist-opencode

      - name: Show tool versions
        run: |
          node --version
          npm --version
          pnpm --version

      - name: Dry run release
        if: ${{ inputs.dry_run }}
        run: pnpm run release:ci --dry-run --increment "$RELEASE_INCREMENT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_INCREMENT: ${{ inputs.increment }}

      - name: Publish release
        if: ${{ !inputs.dry_run }}
        run: pnpm run release:ci --increment "$RELEASE_INCREMENT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_INCREMENT: ${{ inputs.increment }}
