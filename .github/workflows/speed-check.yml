name: Speed Check

on:
  pull_request:

concurrency:
  group: speed-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  speed-check:
    name: Speed - PR vs base
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.9.1
          package_json_file: head/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: pnpm
          cache-dependency-path: |
            head/pnpm-lock.yaml
            base/pnpm-lock.yaml
      - name: Build the base branch
        working-directory: base
        run: pnpm install --frozen-lockfile && pnpm run build
      - name: Build the PR
        working-directory: head
        run: pnpm install --frozen-lockfile && pnpm run build
      - name: Compare runtimes
        run: node head/scripts/perf-regression-check.mjs --base base/dist/index.js --head head/dist/index.js
