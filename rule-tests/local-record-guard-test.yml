id: local-record-guard
valid:
  - "import { asRecord } from '../../utils/as-record.js';"
  - "function isRecordLike(value) { return isRecord(value) && 'id' in value; }"
invalid:
  - "function isRecord(value: unknown): value is Record<string, unknown> { return typeof value === 'object' && value !== null; }"
  - 'export function asRecord(value) { return isRecord(value) ? value : undefined; }'
  - "export const isRecord = (value: unknown): value is Record<string, unknown> => typeof value === 'object';"
