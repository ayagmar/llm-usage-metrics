id: class-boolean-flag
language: TypeScript
severity: warning
message: A mutable boolean on a class is a hidden state; use one discriminated state field
files:
  - src/**
  - packages/core/src/**
  - scripts/**
ignores:
  - '**/*.generated.ts'
rule:
  kind: public_field_definition
  regex: '^(private |protected )?[a-zA-Z]+( = (true|false)|\??: boolean)'
  not:
    regex: '\breadonly\b'
