id: first-timestamp-owner
language: TypeScript
severity: error
message: Use firstTimestamp from packages/core/src/sources/parsing-utils.ts
note: A loop that returns the first candidate normalizeTimestampCandidate accepts is firstTimestamp.
files:
  - packages/core/src/**
ignores:
  - packages/core/src/sources/parsing-utils.ts
# A loop over timestamp candidates: the loop variable itself, or a key into a record, is
# the argument. A loop over lines that normalizes `line.timestamp` is not flagged.
rule:
  pattern: for (const $C of $LIST) { $$$ }
  has:
    stopBy: end
    any:
      - pattern: normalizeTimestampCandidate($C)
      - pattern: normalizeTimestampCandidate($R[$C])
