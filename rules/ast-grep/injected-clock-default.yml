id: injected-clock-default
language: TypeScript
severity: error
message: Read the injected clock with readNow, or withRunClock at a run's entry, from src/cli/run-clock.ts
note: >-
  A run reads the clock once (withRunClock), so its windows, dataset and share page agree
  on the time. Flags the equivalent forms of an optional clock defaulting to new Date().
  packages/core/src and scripts/ are out of scope: they cannot import src/cli.
files:
  - src/**
ignores:
  - src/cli/run-clock.ts
  - '**/*.generated.ts'
rule:
  any:
    - pattern: $CLOCK?.() ?? new Date()
    - pattern: $CLOCK?.() || new Date()
    - pattern: '$CLOCK ? $CLOCK() : new Date()'
    - pattern: $CLOCK ?? (() => new Date())
    - pattern: $CLOCK || (() => new Date())
